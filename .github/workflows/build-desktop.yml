name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install server dependencies
        working-directory: server
        run: pnpm install

      - name: Build server sidecar
        run: node scripts/build-server.js

      - name: Verify sidecar files
        run: |
          dir src-tauri\binaries\ /b
          echo ---
          dir src-tauri\binaries\aiyou-server-*.exe /b 2>nul || echo "No .exe sidecar found"
        shell: cmd

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: pnpm tauri build --verbose 2>&1

      - name: List build output
        if: always()
        run: |
          dir src-tauri\target\release\bundle\ /s /b 2>nul || echo "no bundle output"
        shell: cmd

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create or update release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: macos-intel-installer
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: macos-arm64-installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install server dependencies
        working-directory: server
        run: pnpm install

      - name: Build server sidecar
        run: node scripts/build-server.js ${{ matrix.target }}

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
